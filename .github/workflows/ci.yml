name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRACE_RUN_LIVE_TESTS: "0"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHON_DOTENV_DISABLED: "1"
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  core-offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,gemini]'
      - run: python -m pytest tests/unit tests/integration tests/release -m 'not live' -q

  reproduction-offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,gemini]'
      - run: python -m reproduction.tau2_telecom validate-split
      - run: python -m reproduction.tau2_telecom plan --evaluation in-loop:all
      - run: python -m pytest tests/reproduction -m 'not live' -q

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
      - run: |
          python -m pip install \
            -r requirements/minimum.txt \
            -r requirements/gemini.txt
      - run: |
          python -m pip install \
            'build>=1.2,<2' \
            'hypothesis>=6,<7' \
            'pytest>=8,<10' \
            'pytest-cov>=6,<8' \
            'setuptools==83.0.0'
      - run: |
          python -m pip install --no-deps -e .
      - run: python -m pytest -m 'not live' -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[dev,gemini]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: |
          npx --yes markdownlint-cli2@0.23.0 \
            README.md CONTRIBUTING.md SECURITY.md THIRD_PARTY_NOTICES.md \
            'docs/**/*.md' reproduction/tau2_telecom/README.md
      - run: |
          npx --yes prettier@3.6.2 --check \
            README.md CONTRIBUTING.md SECURITY.md THIRD_PARTY_NOTICES.md \
            'docs/**/*.md' reproduction/tau2_telecom/README.md
      - run: |
          python -m compileall -q \
            src/grace \
            reproduction/tau2_telecom \
            examples \
            scripts
      - run: |
          python -m mypy \
            src/grace \
            reproduction/tau2_telecom \
            scripts/normalize_sdist.py \
            scripts/release_plan.py \
            scripts/verify_distributions.py
  tau2-adapter:
    runs-on: ubuntu-latest
    env:
      TAU2_REVISION: c5b2d228d850c59b749b93cf32c4745d3aa53967
      TAU2_DATA_DIR: ${{ github.workspace }}/.tau2-bench/data
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: sierra-research/tau2-bench
          ref: c5b2d228d850c59b749b93cf32c4745d3aa53967
          path: .tau2-bench
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - run: |
          test "$(git -C .tau2-bench rev-parse HEAD)" = "$TAU2_REVISION"
          python -m pip install ./.tau2-bench
          python -m pip install -e '.[dev,gemini]'
      - run: python -m reproduction.tau2_telecom validate-split
      - run: python -m pytest tests/reproduction -q
