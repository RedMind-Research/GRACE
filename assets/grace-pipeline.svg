<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc">
  <title id="title">GRACE product pipeline</title>
  <desc id="desc">Instruction and schema initialize state; diagnosis evolves graph and instruction.</desc>
  <style>.box{fill:#f8fafc;stroke:#334155;stroke-width:2}.accent{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.t{font:18px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}.s{font:14px system-ui,sans-serif;fill:#475569;text-anchor:middle}.a{stroke:#64748b;stroke-width:2;marker-end:url(#m)}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
  <rect id="canvas-background" width="1000" height="230" fill="#fff"/>
  <rect class="box" x="25" y="55" width="190" height="110" rx="12"/><text class="t" x="120" y="95">Instruction</text><text class="s" x="120" y="125">+ network schema</text>
  <line class="a" x1="215" y1="110" x2="285" y2="110"/>
  <rect class="accent" x="290" y="55" width="180" height="110" rx="12"/><text class="t" x="380" y="102">Initialize</text><text class="s" x="380" y="130">Prompt-to-Graph</text>
  <line class="a" x1="470" y1="110" x2="540" y2="110"/>
  <rect class="box" x="545" y="35" width="190" height="150" rx="12"/><text class="t" x="640" y="92">GraceState</text><text class="s" x="640" y="122">graph + instruction</text><text class="s" x="640" y="148">checkpoint lineage</text>
  <line class="a" x1="735" y1="110" x2="805" y2="110"/>
  <rect class="accent" x="810" y="55" width="165" height="110" rx="12"/><text class="t" x="892" y="102">Evolve</text><text class="s" x="892" y="130">+ diagnosis report</text>
</svg>
